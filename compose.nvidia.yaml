name: jg-nvidia

# GPU inference stack for the NVIDIA device (CUDA + nvidia-container-toolkit).
#
# This host has no NVIDIA runtime, so this file is NOT started here. It is kept
# in the repo next to compose.yaml only so the configuration lives in one place.
#
#   docker compose -f compose.nvidia.yaml up -d
#
# Note: these services used to be part of the `jg-server` project. On the NVIDIA
# device, remove the old containers once before the first run, otherwise the
# explicit container_name values collide:
#
#   docker rm -f llama-server llama-server-coder

services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-server
    ports:
      - "8081:8080"
    volumes:
      - ${LLAMA_MODELS_DIR}:/llama-setup/models
    environment:
      # Automatically download and run from HuggingFace if not using local volumes
      - LLAMA_ARG_MODEL=/llama-setup/models/qwen3.5-4b-diktat-de-ch-q8_0.gguf
      - LLAMA_ARG_N_GPU_LAYERS=20
      - LLAMA_ARG_CTX_SIZE=16384
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  llama-server-coder:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-server-coder
    ports:
      - "8083:8080"
    volumes:
      - ${LLAMA_MODELS_DIR}:/llama-setup/models
    environment:
      - LLAMA_ARG_MODEL=/llama-setup/models/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
      - LLAMA_ARG_N_GPU_LAYERS=99
      - LLAMA_ARG_CTX_SIZE=12288
      # quantized KV cache keeps a 4B model inside 4 GB of VRAM
      - LLAMA_ARG_CACHE_TYPE_K=q8_0
      - LLAMA_ARG_CACHE_TYPE_V=q8_0
      # required for OpenAI-style tool calling
      - LLAMA_ARG_JINJA=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
