name: jg-server

# Homelab stack for this host.
# GPU inference lives elsewhere: llamacpp-rx580.yaml (this host, RX 580 / Vulkan)
# and compose.nvidia.yaml (the NVIDIA device).

services:
  db_dev:
    image: postgres:16-alpine
    container_name: jg-postgresdb-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jthan-dev}
      # no default: the password lives only in .env, never in the repo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-jg-portfolio}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - jg_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-jthan-dev} -d $${POSTGRES_DB:-jg_portfolio}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  syncthing:
    image: syncthing/syncthing
    container_name: jg-syncthing
    restart: unless-stopped
    ports:
      - "8384:8384"        # WebUI
      - "22000:22000"      # Sync traffic (TCP)
      - "22000:22000/udp"  # Sync traffic (QUIC)
      - "21027:21027/udp"  # Local discovery
    user: "1000:1000"
    volumes:
      - ${SYNCTHING_USER_DIR}/config:/var/syncthing/config
      - ${SYNCTHING_WORKING_DIR}:/var/syncthing/

  stirling-pdf:
    image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:latest
    container_name: stirling-pdf
    ports:
      - '8080:8080'
    volumes:
      - ${STIRLING_DATA_DIR}:/var/configs
    restart: unless-stopped

  nextcloud-aio-mastercontainer:
    image: ghcr.io/nextcloud-releases/all-in-one:latest
    container_name: nextcloud-aio-mastercontainer
    restart: always
    ports:
      - "80:80"
      - "8082:8080"
      - "8443:8443"
    volumes:
      - nextcloud_aio_mastercontainer:/mnt/docker-aio-config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      APACHE_PORT: 11000
    stop_grace_period: 30s

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: cloudbeaver
    ports:
      - "8978:8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace

volumes:
  nextcloud_aio_mastercontainer:
    name: nextcloud_aio_mastercontainer
  jg_pgdata:
  cloudbeaver_data:
